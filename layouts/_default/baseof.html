<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" dir="{{ .Site.Language.Params.direction | default "rtl" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  {{- partial "nav.html" . -}}
  <main class="main">
    {{- block "main" . }}{{- end }}
  </main>
  {{- partial "footer.html" . -}}
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      var root = document.documentElement;
      function update() {
        var isNavy = root.getAttribute('data-theme') === 'navy';
        btn.textContent = isNavy ? '☀️' : '🌙';
      }
      update();
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'navy' ? '' : 'navy';
        if (next) {
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
        } else {
          root.removeAttribute('data-theme');
          localStorage.removeItem('theme');
        }
        update();
      });
    })();
  </script>
</body>
</html>
