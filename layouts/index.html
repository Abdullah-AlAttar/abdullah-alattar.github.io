{{ define "main" }}
<section class="hero">
  <h1>{{ i18n "site_title" }}</h1>
  <div class="search-bar">
    <input type="text" id="home-search" placeholder="{{ i18n "search_placeholder" }}" autocomplete="off" />
  </div>
</section>

<section class="recipes-grid">
  {{ range where .Site.RegularPages "Section" "recipes" }}
  {{- partial "recipe-card.html" . -}}
  {{ end }}
</section>

<script>
  document.getElementById('home-search').addEventListener('focus', function() {
    window.location.href = '{{ "search/" | relURL }}';
  });
</script>
{{ end }}
